name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 质量门槛
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 语法检查（node --check）
        run: |
          set -e
          fail=0
          for f in src/*.js public/*.js scripts/*.mjs; do
            [ -e "$f" ] || continue
            if node --check "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      - name: 配置完整性（wrangler.toml 必须声明主入口与 D1 绑定）
        run: |
          set -e
          grep -q '^main = "src/index.js"' wrangler.toml
          grep -q 'binding = "DB"' wrangler.toml
          grep -q 'binding = "KV"' wrangler.toml
          echo "wrangler.toml 关键 binding 齐全"

      - name: 迁移可在空库顺序执行（走部署同一套 d1-migrate.mjs）
        run: |
          set -e
          # 用与 deploy.yml 相同的执行器在干净 persist 目录里从 0001 顺序跑，
          # 既验证 migration 本身没被改坏、也验证迁移器在空库上能正常执行
          rm -rf .wrangler/ci-state
          export D1_WRANGLER_EXTRA_ARGS="--persist-to .wrangler/ci-state"
          node scripts/d1-migrate.mjs --local
          npx wrangler d1 execute lightning-shop-db --local --persist-to .wrangler/ci-state \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" --json \
            | grep -q '"orders"'

          # 幂等：再跑一次必须全部跳过（不重复执行、不写重复账本）
          OUT="$(node scripts/d1-migrate.mjs --local)"
          echo "$OUT"
          echo "$OUT" | grep -q "执行 0 / 基线 0 / 跳过 $(( $(ls migrations/*.sql | wc -l) )) "

          # 账本必须覆盖全部迁移文件
          npx wrangler d1 execute lightning-shop-db --local --persist-to .wrangler/ci-state \
            --command "SELECT COUNT(*) AS c FROM _d1_migrations" --json \
            | tee /tmp/ledger.json
          grep -q "\"c\": $(ls migrations/*.sql | wc -l)" /tmp/ledger.json
          echo "迁移顺序执行与幂等校验通过"

      - name: 禁止把本地密钥文件提交进仓库
        run: |
          set -e
          if git ls-files --error-unmatch .dev.vars >/dev/null 2>&1; then
            echo "::error::.dev.vars 被纳入了 Git 跟踪，必须从索引移除"
            exit 1
          fi
          echo "未跟踪 .dev.vars"
