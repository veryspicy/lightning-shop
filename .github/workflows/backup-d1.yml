name: Backup D1

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00，避开业务高峰
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    name: 导出 D1 并归档到 R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 导出 D1（结构 + 数据）
        run: |
          set -e
          STAMP="$(date -u +%Y-%m-%d)"
          npx wrangler d1 export lightning-shop-db --remote --output "d1-${STAMP}.sql"
          gzip -9 "d1-${STAMP}.sql"
          ls -lh "d1-${STAMP}.sql.gz"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 归档到 R2（d1-backup/ 前缀，保留 10 天内的 action artifact）
        run: |
          set -e
          npx wrangler r2 object put "lightning-shop-images/d1-backup/d1-${STAMP}.sql.gz" \
            --file "d1-${STAMP}.sql.gz" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 归档回读校验（R2 对象可下载 + gzip 可解 + 数据非空）
        run: |
          set -euo pipefail
          KEY="lightning-shop-images/d1-backup/d1-${STAMP}.sql.gz"
          npx wrangler r2 object get "$KEY" --file "verify-${STAMP}.sql.gz" --remote
          ls -lh "verify-${STAMP}.sql.gz"
          gzip -t "verify-${STAMP}.sql.gz"
          gunzip -c "verify-${STAMP}.sql.gz" > "verify-${STAMP}.sql"
          echo "解压后大小: $(wc -c < "verify-${STAMP}.sql") 字节"

          for T in kv_doc products orders order_items migration_state; do
            grep -q "CREATE TABLE[^;]*\b${T}\b" "verify-${STAMP}.sql" \
              || { echo "::error::备份缺少核心表 ${T}"; exit 1; }
          done

          ROWS=$(grep -c 'INSERT INTO "products"' "verify-${STAMP}.sql" || true)
          echo "备份内 products 数据行: ${ROWS}"
          if [ "${ROWS}" -le 0 ]; then
            echo "::error::备份内 products 无数据行，快照不可用"
            exit 1
          fi

          ONLINE=$(curl -fsS https://lightning-shop.gora.dpdns.org/api/products \
            | grep -o '"id"' | wc -l | tr -d ' ')
          echo "线上 products 条数: ${ONLINE}"
          if [ "${ROWS}" != "${ONLINE}" ]; then
            echo "::warning::备份行数(${ROWS}) 与线上条数(${ONLINE}) 不一致，请人工核对是否导出截断"
          else
            echo "::notice::备份与线上 products 条数一致（${ROWS}）"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Artifact 兜底（保留 10 天）
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ env.STAMP }}
          path: d1-*.sql.gz
          retention-days: 10
          if-no-files-found: error

      - name: 输出回滚提示
        run: |
          echo "::notice::D1 备份已归档到 R2 前缀 d1-backup/ 并通过回读校验（可下载/gzip 可解/数据非空）；也可以用 Cloudflare D1 Time Travel（30 天窗口）按时间点恢复"
