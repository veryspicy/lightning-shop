name = "lightning-shop"
main = "src/index.js"
compatibility_date = "2026-10-25"

# 静态资源托管：public/ 目录由 Worker 自动 serve
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV：产品货盘数据
[[kv_namespaces]]
binding = "KV"
id = "5a0e6d1276b246c589f6bf44216701c2"
preview_id = "5a0e6d1276b246c589f6bf44216701c2"

# R2：产品图片对象存储
[[r2_buckets]]
binding = "R2"
bucket_name = "lightning-shop-images"
preview_bucket_name = "lightning-shop-images"

# 环境变量（部署时替换）
[vars]
SITE_NAME = "Lightning Shop"
CONTACT_WECHAT = "lightning-shop"
# 管理后台密码不在此配置：本地开发在 .dev.vars 设置 ADMIN_PASSWORD，
# 线上部署用 `wrangler secret put ADMIN_PASSWORD` 注入加密环境变量
