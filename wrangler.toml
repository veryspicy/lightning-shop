name = "lightning-shop"
main = "src/index.js"
compatibility_date = "2026-10-25"

# 静态资源托管：public/ 目录由 Worker 自动 serve
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 请求先进入 Worker fetch（主站化 301、指纹脚本长缓存等逻辑生效），未命中再走 ASSETS 兜底
run_worker_first = true

# KV：产品货盘数据
[[kv_namespaces]]
binding = "KV"
id = "5a0e6d1276b246c589f6bf44216701c2"
preview_id = "5a0e6d1276b246c589f6bf44216701c2"

# R2：产品图片对象存储
[[r2_buckets]]
binding = "R2"
bucket_name = "lightning-shop-images"
preview_bucket_name = "lightning-shop-images"

# D1：主数据库（0 费用档：5GB 存储 / 500 万行读每天 / 10 万行写每天）
# 阶段 0 为影子双写，KV 仍是读源；阶段 1 起 D1 成为权威源，KV 退化为缓存。
[[d1_databases]]
binding = "DB"
database_name = "lightning-shop-db"
database_id = "2103c08c-7b00-4eae-b29a-a9c7852986c4"
migrations_dir = "migrations"

# 环境变量（部署时替换）
[vars]
SITE_NAME = "Lightning Shop"
CONTACT_WECHAT = "lightning-shop"
# 管理后台密码不在此配置：本地开发在 .dev.vars 设置 ADMIN_PASSWORD，
# 线上部署用 `wrangler secret put ADMIN_PASSWORD` 注入加密环境变量

# Observability：日志、链路追踪与问题检测（持久化开启）
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# 限流 binding（Cloudflare 原生 Rate Limiting API）
# 按 Cloudflare 机房（PoP）计数、跨 isolate 生效，与 Worker 内内存桶取严。
# namespace_id 是账户内唯一整数标识，limit/period 中 period 只支持 10 或 60 秒。
[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_ORDER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_QUERY"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# 账号维度登录闸：键为「IP|用户名」，堵跨 isolate 单账号口令爆破。
# 原生 RL 的 period 只支持 10/60 秒，故用 5 次/60 秒（比内存桶 5 次/300 秒更严），两闸取严。
[[ratelimits]]
name = "RL_LOGIN_ACCT"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 5
  period = 60

# 账号维度登录闸的确定性实现：Durable Object 单实例串行、计数持久化。
# 内存桶随 isolate 重启清零，原生 Rate Limiting binding 在实测中未真正累计计数
# （连续 7 次错误登录毫无拦截），故把「同账号累计 N 次即拦」交给 DO 兜底。
[[durable_objects.bindings]]
name = "LOGIN_THROTTLE"
class_name = "LoginThrottle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginThrottle"]

# ─────────────────────────────────────────────────────────────────────
# Previews：Cloudflare Workers Builds 预览环境专用配置
# `npx wrangler preview` 强制要求本块；资源与生产隔离，避免预览构建
# 读写生产数据。R2 因账号 OAuth 未授予 workers_r2 权限无法新建桶，
# 预览复用生产图片桶 lightning-shop-images（仅承载图片对象）。
# ─────────────────────────────────────────────────────────────────────
[previews.vars]
SITE_NAME = "Lightning Shop (Preview)"
CONTACT_WECHAT = "lightning-shop"
# PREVIEW=1：预览环境豁免「workers.dev 301 主站化」，让预览 URL 可独立冒烟，
# 不被重定向到生产域。生产环境不设该变量，主站化行为不变。
PREVIEW = "1"

[[previews.kv_namespaces]]
binding = "KV"
id = "783fadf57dce4ee0a035ffd9d88ae80b"

[[previews.d1_databases]]
binding = "DB"
database_name = "lightning-shop-db-preview"
database_id = "1fd147c0-b748-4b5d-9918-bbbb415e47b5"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "R2"
bucket_name = "lightning-shop-images"

# 预览用独立的 rate limit 命名空间段（2001-2004），不与生产 1001-1004 共用计数。
[[previews.ratelimits]]
name = "RL_LOGIN"
namespace_id = "2001"

  [previews.ratelimits.simple]
  limit = 30
  period = 60

[[previews.ratelimits]]
name = "RL_ORDER"
namespace_id = "2002"

  [previews.ratelimits.simple]
  limit = 20
  period = 60

[[previews.ratelimits]]
name = "RL_QUERY"
namespace_id = "2003"

  [previews.ratelimits.simple]
  limit = 30
  period = 60

[[previews.ratelimits]]
name = "RL_LOGIN_ACCT"
namespace_id = "2004"

  [previews.ratelimits.simple]
  limit = 5
  period = 60

[[previews.durable_objects.bindings]]
name = "LOGIN_THROTTLE"
class_name = "LoginThrottle"
