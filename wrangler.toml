name = "lightning-shop"
main = "src/index.js"
compatibility_date = "2026-10-25"

# 静态资源托管：public/ 目录由 Worker 自动 serve
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 请求先进入 Worker fetch（主站化 301、指纹脚本长缓存等逻辑生效），未命中再走 ASSETS 兜底
run_worker_first = true

# KV：产品货盘数据
[[kv_namespaces]]
binding = "KV"
id = "5a0e6d1276b246c589f6bf44216701c2"
preview_id = "5a0e6d1276b246c589f6bf44216701c2"

# R2：产品图片对象存储
[[r2_buckets]]
binding = "R2"
bucket_name = "lightning-shop-images"
preview_bucket_name = "lightning-shop-images"

# 环境变量（部署时替换）
[vars]
SITE_NAME = "Lightning Shop"
CONTACT_WECHAT = "lightning-shop"
# 管理后台密码不在此配置：本地开发在 .dev.vars 设置 ADMIN_PASSWORD，
# 线上部署用 `wrangler secret put ADMIN_PASSWORD` 注入加密环境变量

# Observability：日志、链路追踪与问题检测（持久化开启）
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# 限流 binding（Cloudflare 原生 Rate Limiting API）
# 按 Cloudflare 机房（PoP）计数、跨 isolate 生效，与 Worker 内内存桶取严。
# namespace_id 是账户内唯一整数标识，limit/period 中 period 只支持 10 或 60 秒。
[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_ORDER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_QUERY"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60
