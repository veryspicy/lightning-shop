<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lightning Shop · 绿色·助农·公益</title>
  <meta name="description" content="农牧特产批发，源头厂家直供。低GI杂粮、黄柿子火锅底料等产地品牌货盘，B2B 批发 + 零售一件代发。" />
  <meta name="theme-color" content="#059669" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lightning Shop" />
  <meta property="og:title" content="Lightning Shop · 绿色·助农·公益" />
  <meta property="og:description" content="农牧特产批发，源头厂家直供。低GI杂粮、黄柿子火锅底料等产地品牌货盘，B2B 批发 + 零售一件代发。" />
  <meta property="og:image" content="https://lightning-shop.gora.dpdns.org/wechat-qr.jpg" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23059669'/%3E%3Cpath d='M13.5 4L5 14h5.5L9.5 20l8.5-10h-5.5L13.5 4z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">⚡</span>
        <span class="brand-name">Lightning<span>Shop</span></span>
      </a>
      <div class="header-actions">
      <button type="button" class="header-contact-btn" id="contact-open" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>联系方式</span>
      </button>
      <button type="button" class="header-contact-btn express" id="express-open" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3v9l-3 3v3l2 1v2h-8v-2l2-1v-3l-3-3V3"/><path d="M9 3h6"/><path d="M12 3v3"/></svg>
        <span>特惠快递</span>
      </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <p class="hero-eyebrow" id="hero-stats">加载中…</p>
      <h1 class="hero-title">农牧特产批发，源头厂家直供</h1>
    </div>
  </section>

  <section class="stats" aria-label="货盘数据">
    <div class="container stats-grid">
      <div class="stat"><strong id="stat-sku">—</strong><span>在售 SKU</span></div>
      <div class="stat"><strong id="stat-brand">—</strong><span>产地品牌</span></div>
      <div class="stat"><strong>1</strong><span>件代发支持</span></div>
      <div class="stat"><strong>2</strong><span>B2B / 零售双模式</span></div>
    </div>
  </section>

  <main id="products" class="container">
    <div class="toolbar">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="搜索品名 / 品牌 / 卖点" aria-label="搜索产品" autocomplete="off" />
      </div>
      <div class="filter-panel">
        <div class="filter-row">
          <span class="filter-label" id="filter-label-category">品类</span>
          <div class="chip-list" id="category-tabs" role="group" aria-labelledby="filter-label-category">
            <button class="chip active" type="button" data-category="" aria-pressed="true">全部</button>
          </div>
        </div>
        <div class="filter-row">
          <span class="filter-label" id="filter-label-brand">品牌</span>
          <div class="chip-list" id="brand-tabs" role="group" aria-labelledby="filter-label-brand">
            <button class="chip active" type="button" data-brand="" aria-pressed="true">全部品牌</button>
          </div>
        </div>
      </div>
    </div>

    <p class="result-meta" id="result-meta" role="status" aria-live="polite"></p>
    <div class="product-grid" id="product-grid" aria-live="polite" aria-busy="true">
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-media shimmer"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line skeleton-line--short shimmer"></div></div>
    </div>
    <div class="empty-state" id="empty-state" hidden>未找到匹配产品，换个关键词试试。</div>
    <nav class="pagination" id="pagination" aria-label="产品分页" hidden></nav>
    <div class="load-more-wrap">
      <button id="load-more" class="btn btn-outline load-more-btn" hidden>加载更多</button>
      <div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div>
    </div>
  </main>

  <section id="b2b" class="b2b">
    <div class="container b2b-inner">
      <div class="b2b-card">
        <h3 id="quote-qr-title">获取完整报价单</h3>
        <p>留下渠道类型与采购量，1 个工作日内回复详细报价单（含物流测算）。</p>
        <img src="/wechat-qr.jpg" alt="报价单二维码" id="quote-qr-img" class="qr-img" width="180" height="180" />
      </div>
      <div class="b2b-card">
        <h3 id="shop-qr-title">扫码直达商城</h3>
        <p>微信扫一扫，随时随地查看最新货盘与报价。</p>
        <div id="site-qr" class="qr-box" hidden></div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Lightning Shop</p>
      <p class="admin-gate">
        <input type="password" id="admin-gate-input" name="lg-gate" class="admin-gate-input" placeholder="口令" autocomplete="new-password" aria-label="管理入口口令" title="输入口令进入管理后台" />
        <a href="/admin" id="admin-gate-link" class="admin-gate-link" rel="nofollow" hidden>供应链管理</a>
      </p>
    </div>
  </footer>

  <!-- 联系方式面板：顶部导航右上角入口弹出 -->
  <div class="contact-mask" id="contact-mask" hidden>
    <div class="contact-panel" role="dialog" aria-modal="true" aria-label="联系方式">
      <div class="contact-head">
        <b>联系方式</b>
        <button type="button" class="contact-close" aria-label="关闭">✕</button>
      </div>
      <div class="contact-body">
        <div class="contact-card">
          <h4 id="contact-quote-title">获取完整报价单</h4>
          <img src="/wechat-qr.jpg" alt="报价单二维码" id="contact-quote-img" class="qr-img" />
          <p>扫码添加微信，获取完整报价单</p>
        </div>
        <div class="contact-card">
          <h4 id="contact-shop-title">扫码直达商城</h4>
          <div id="contact-site-qr" class="qr-box" hidden></div>
          <p>微信扫一扫，随时随地查看货盘与报价</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 特惠快递面板：顶部导航右上角入口弹出 -->
  <div class="contact-mask express-mask" id="express-mask" hidden>
    <div class="contact-panel express-panel" role="dialog" aria-modal="true" aria-label="特惠快递">
      <div class="contact-head">
        <b>特惠快递</b>
        <button type="button" class="contact-close" aria-label="关闭">✕</button>
      </div>
      <div class="contact-body express-body">
        <div class="express-card">
          <img src="/express-poster.jpg" alt="寄件省钱计划" class="express-img" />
        </div>
      </div>
    </div>
  </div>

  <script src="/qrcode.min.js?v=20261103" defer></script>
  <script src="/app.js?v=20261103" defer></script>
</body>
</html>
